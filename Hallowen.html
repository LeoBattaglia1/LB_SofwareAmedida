<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Dark Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Creepster&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --rojo: #8e1717;
        --texto: #e8e1d7;
        --madera-oscura: #100b09;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background: #030303;
        color: var(--texto);
        font-family: "Cinzel", serif;
        overflow-x: hidden;
      }

      button,
      input {
        font: inherit;
      }

      .escena {
        position: relative;
        isolation: isolate;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        padding: 1rem;
        overflow: hidden;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            ellipse at 50% 43%,
            rgba(55, 53, 53, 0.24),
            transparent 34%
          ),
          linear-gradient(180deg, #08090b 0%, #101010 55%, #030303 100%);
      }

      .luna {
        position: absolute;
        top: 5%;
        right: 10%;
        width: clamp(70px, 15vw, 160px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #9b9b94;
        opacity: 0.13;
        filter: blur(2px);
        box-shadow: 0 0 70px 25px rgba(180, 185, 190, 0.08);
      }

      .niebla {
        position: absolute;
        z-index: 1;
        left: -20%;
        width: 140%;
        height: 32%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(145, 145, 145, 0.12),
          rgba(70, 70, 70, 0.08),
          transparent
        );
        filter: blur(25px);
        pointer-events: none;
      }

      .niebla1 {
        bottom: 10%;
        animation: nieblaMover 17s ease-in-out infinite alternate;
      }

      .niebla2 {
        bottom: 28%;
        opacity: 0.6;
        animation: nieblaMover 23s ease-in-out infinite alternate-reverse;
      }

      @keyframes nieblaMover {
        from {
          transform: translateX(-8%) translateY(8px);
        }
        to {
          transform: translateX(8%) translateY(-10px);
        }
      }

      /* Tormenta y rayos */
      .tormenta,
      .destello {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .tormenta {
        z-index: 2;
        opacity: 0;
        background: rgba(205, 215, 225, 0.13);
      }

      .tormenta-activa .tormenta {
        animation: tormentaGeneral 6.5s infinite;
      }

      @keyframes tormentaGeneral {
        0%,
        17%,
        19%,
        52%,
        54%,
        100% {
          opacity: 0;
        }
        18%,
        53% {
          opacity: 0.55;
        }
        18.5%,
        53.5% {
          opacity: 0.08;
        }
      }

      .relampago {
        position: absolute;
        z-index: 3;
        top: -5%;
        width: 30%;
        height: 75%;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 0 9px rgba(220, 230, 255, 0.95));
        background: rgba(220, 228, 255, 0.95);
        clip-path: polygon(
          54% 0,
          66% 0,
          46% 31%,
          62% 31%,
          25% 73%,
          37% 46%,
          20% 46%
        );
      }

      .relampago1 {
        left: 15%;
        animation: rayoUno 4.2s infinite;
      }

      .relampago2 {
        right: 9%;
        transform: scaleX(0.7) rotate(7deg);
        animation: rayoDos 5.4s infinite 1.1s;
      }

      .relampago3 {
        left: 45%;
        top: -13%;
        transform: scale(0.75) rotate(-12deg);
        animation: rayoTres 6.1s infinite 2.3s;
      }

      @keyframes rayoUno {
        0%,
        35%,
        37%,
        72%,
        74%,
        100% {
          opacity: 0;
        }
        35.5%,
        36.5%,
        72.5% {
          opacity: 0.9;
        }
      }

      @keyframes rayoDos {
        0%,
        24%,
        26%,
        63%,
        66%,
        100% {
          opacity: 0;
        }
        24.5%,
        25.5%,
        64% {
          opacity: 0.8;
        }
      }

      @keyframes rayoTres {
        0%,
        47%,
        49%,
        82%,
        84%,
        100% {
          opacity: 0;
        }
        47.5%,
        48.5%,
        83% {
          opacity: 0.75;
        }
      }

      .destello {
        z-index: 7;
        background: #d9e0ee;
        opacity: 0;
      }

      .tormenta-activa .destello {
        animation: destellos 4.8s infinite;
      }

      @keyframes destellos {
        0%,
        21%,
        24%,
        39%,
        42%,
        67%,
        70%,
        100% {
          opacity: 0;
        }
        22% {
          opacity: 0.22;
        }
        23% {
          opacity: 0.04;
        }
        40% {
          opacity: 0.36;
        }
        41% {
          opacity: 0.03;
        }
        68% {
          opacity: 0.28;
        }
        69% {
          opacity: 0.02;
        }
      }

      /* Telarañas en las esquinas */
      .telarana {
        position: absolute;
        z-index: 8;
        width: clamp(80px, 20vw, 260px);
        color: rgba(205, 205, 198, 0.52);
        filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.9));
        pointer-events: none;
        opacity: 0;
        animation: aparecerTelarana 2.2s ease-out forwards;
      }

      .telarana-superior {
        top: 0;
        left: 0;
        transform-origin: top left;
        animation-delay: 1.2s;
      }

      .telarana-inferior {
        right: 0;
        bottom: 0;
        transform: rotate(180deg);
        transform-origin: bottom right;
        animation-delay: 2.8s;
      }

      @keyframes aparecerTelarana {
        0% {
          opacity: 0;
          scale: 0.55;
        }
        70% {
          opacity: 0.65;
        }
        100% {
          opacity: 1;
          scale: 1;
        }
      }

      .contenido {
        position: relative;
        z-index: 5;
        width: min(95%, 700px);
        text-align: center;
        padding: 16px 12px;
        transition:
          opacity 0.8s ease,
          transform 0.8s ease,
          filter 0.8s ease;
      }

      .subtitulo {
        color: #a9a29a;
        font-size: clamp(0.6rem, 3.2vw, 0.85rem);
        letter-spacing: 0.18em;
        margin: 0 0 12px;
      }

      h1 {
        font-family: "Creepster", cursive;
        font-weight: 400;
        font-size: clamp(2.4rem, 11vw, 6.5rem);
        line-height: 1.05;
        letter-spacing: 0.035em;
        color: #b9b1a7;
        text-shadow:
          0 3px 0 #292321,
          0 0 22px rgba(0, 0, 0, 0.9);
        margin: 0;
      }

      .descripcion {
        color: #aaa39b;
        font-size: clamp(0.8rem, 3.5vw, 1.05rem);
        margin: 16px 0 24px;
      }

      .boton-principal {
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
        perspective: 800px;
        filter: brightness(0.58) saturate(0.58);
        transition:
          filter 0.4s ease,
          transform 0.4s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .boton-principal:hover,
      .boton-principal:active {
        filter: brightness(0.78) saturate(0.65);
        transform: translateY(-3px);
      }

      .boton-principal:focus-visible {
        outline: 2px solid #aaa;
        outline-offset: 8px;
      }

      .puerta {
        position: relative;
        display: block;
        width: clamp(110px, 32vw, 190px);
        height: clamp(180px, 50vw, 290px);
        margin: 0 auto;
        overflow: hidden;
        border: 5px solid #080605;
        background: linear-gradient(
          90deg,
          #0a0706,
          #1b100b 30%,
          #0d0907 55%,
          #1b100b 78%,
          #080605
        );
        box-shadow:
          inset 0 0 25px #000,
          0 15px 30px rgba(0, 0, 0, 0.65);
      }

      .tabla {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(0, 0, 0, 0.55);
      }

      .tabla1 {
        left: 29%;
      }
      .tabla2 {
        left: 52%;
      }
      .tabla3 {
        left: 76%;
      }

      .marco-puerta {
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(85, 63, 48, 0.22);
        box-shadow: inset 0 0 16px #000;
      }

      .picaporte {
        position: absolute;
        right: 18%;
        top: 52%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3d3328;
        box-shadow: 0 0 4px #000;
      }

      .placa-puerta {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        color: #7c7166;
        font-size: clamp(0.55rem, 2.5vw, 0.7rem);
        letter-spacing: 0.2em;
        text-shadow: 0 2px 4px #000;
      }

      .instruccion {
        color: #77716a;
        font-size: clamp(0.55rem, 2.5vw, 0.65rem);
        letter-spacing: 0.15em;
        margin-top: 16px;
      }

      /* El contenido inicial se diluye */
      .escena.deshaciendo .contenido {
        opacity: 0;
        transform: scale(1.08) translateY(-12px);
        filter: blur(18px);
        pointer-events: none;
      }

      /* Login */
      .login {
        position: absolute;
        z-index: 9;
        top: 50%;
        left: 50%;
        width: min(92%, 420px);
        max-height: 85vh;
        max-height: 85svh;
        overflow-y: auto;
        padding: 28px 20px 22px;
        background: rgba(7, 7, 7, 0.94);
        border: 1px solid rgba(125, 112, 101, 0.35);
        box-shadow:
          0 0 50px rgba(0, 0, 0, 0.9),
          inset 0 0 28px rgba(45, 10, 10, 0.14);
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, -44%) scale(0.72) rotate(-2deg);
        filter: blur(12px);
        pointer-events: none;
      }

      .login.visible {
        visibility: visible;
        pointer-events: auto;
        animation: loginAparece 1.2s cubic-bezier(0.14, 0.8, 0.22, 1) forwards;
      }

      @keyframes loginAparece {
        0% {
          opacity: 0;
          transform: translate(-35%, -44%) scale(0.68) rotate(4deg);
          filter: blur(15px);
        }
        38% {
          opacity: 1;
          transform: translate(-53%, -48%) scale(1.04) rotate(-2deg);
          filter: blur(3px);
        }
        55% {
          transform: translate(-47%, -51%) scale(0.98) rotate(1.5deg);
          filter: blur(0);
        }
        72% {
          transform: translate(-51%, -49%) scale(1.01) rotate(-0.7deg);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1) rotate(0);
          filter: blur(0);
        }
      }

      .cerrar-login {
        position: absolute;
        top: 6px;
        right: 10px;
        padding: 8px 12px;
        color: #a9a19a;
        background: transparent;
        border: 0;
        font-size: 1.8rem;
        line-height: 1;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .login h2 {
        font-size: clamp(1.2rem, 5vw, 1.8rem);
        text-align: center;
        margin: 0 0 10px;
        color: #c5bcb2;
      }

      .login-texto {
        color: #8d8580;
        text-align: center;
        font-family: serif;
        font-style: italic;
        font-size: clamp(0.8rem, 3vw, 0.95rem);
        margin: 0 0 20px;
      }

      #formulario {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #formulario label {
        color: #a69b91;
        font-size: 0.65rem;
        letter-spacing: 0.15em;
        margin-top: 4px;
      }

      #formulario input {
        width: 100%;
        padding: 12px;
        color: #e7e0d8;
        background: #0d0b0a;
        border: 1px solid #342b26;
        outline: none;
        font-size: 16px; /* Evita que iOS aplique zoom automático al enfocar */
      }

      #formulario input:focus {
        border-color: #756358;
        box-shadow: 0 0 12px rgba(110, 75, 55, 0.2);
      }

      #formulario input::placeholder {
        color: #5f5852;
      }

      .boton-enviar {
        margin-top: 10px;
        padding: 12px;
        color: #c9c0b7;
        background: #211714;
        border: 1px solid #4b352b;
        letter-spacing: 0.18em;
        cursor: pointer;
        transition:
          background 0.25s,
          letter-spacing 0.25s;
        -webkit-tap-highlight-color: transparent;
      }

      .boton-enviar:hover,
      .boton-enviar:active {
        background: #38201a;
        letter-spacing: 0.24em;
      }

      .mensaje {
        min-height: 1.2em;
        margin: 6px 0 0;
        text-align: center;
        font-size: 0.8rem;
        color: #b5aaa0;
      }

      .suelo {
        position: absolute;
        z-index: 1;
        left: 0;
        right: 0;
        bottom: 0;
        height: 17%;
        background: linear-gradient(
          0deg,
          #020202,
          rgba(5, 5, 5, 0.7),
          transparent
        );
        pointer-events: none;
      }

      #particulas {
        position: absolute;
        z-index: 4;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .particula {
        position: absolute;
        bottom: -20px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(180, 170, 155, 0.5);
        box-shadow: 0 0 8px rgba(180, 170, 155, 0.3);
        animation: particulaSube linear forwards;
      }

      @keyframes particulaSube {
        to {
          transform: translate(var(--deriva), -110vh);
          opacity: 0;
        }
      }

      .viñeta {
        position: absolute;
        z-index: 10;
        inset: 0;
        box-shadow: inset 0 0 100px 30px #000;
        pointer-events: none;
      }

      /* Media Queries para teléfonos pequeños */
      @media (max-width: 480px) {
        .escena {
          padding: 0.5rem;
        }
        .login {
          padding: 24px 16px 18px;
        }
        .telarana {
          width: 90px;
        }
        .subtitulo {
          letter-spacing: 0.12em;
        }
        .viñeta {
          box-shadow: inset 0 0 60px 20px #000;
        }
      }

      /* Ajuste para pantallas apaisadas / de poca altura (orientación horizontal) */
      @media (max-height: 600px) {
        .escena {
          min-height: 100vh;
        }
        .puerta {
          height: 140px;
          width: 90px;
        }
        .descripcion {
          margin: 8px 0 14px;
        }
        .login {
          padding: 18px 16px;
          max-height: 92vh;
        }
        .login-texto {
          margin-bottom: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="escena tormenta-activa" id="escena">
      <div class="luna" aria-hidden="true"></div>
      <div class="niebla niebla1" aria-hidden="true"></div>
      <div class="niebla niebla2" aria-hidden="true"></div>

      <div class="tormenta" aria-hidden="true"></div>
      <div class="relampago relampago1" aria-hidden="true"></div>
      <div class="relampago relampago2" aria-hidden="true"></div>
      <div class="relampago relampago3" aria-hidden="true"></div>
      <div class="destello" aria-hidden="true"></div>

      <svg
        class="telarana telarana-superior"
        viewBox="0 0 220 220"
        aria-hidden="true"
      >
        <g fill="none" stroke="currentColor" stroke-width="1.3">
          <path
            d="M0 0 L220 0 M0 0 L0 220 M0 0 L220 220 M0 0 L150 220 M0 0 L220 120"
          />
          <path
            d="M25 0 Q25 35 0 45 M55 0 Q55 65 0 85 M90 0 Q90 90 0 125 M130 0 Q130 125 0 165 M175 0 Q175 175 0 205"
          />
          <path
            d="M0 25 Q35 25 45 0 M0 55 Q65 55 85 0 M0 90 Q90 90 125 0 M0 130 Q125 130 165 0 M0 175 Q175 175 205 0"
          />
        </g>
      </svg>
      <svg
        class="telarana telarana-inferior"
        viewBox="0 0 220 220"
        aria-hidden="true"
      >
        <g fill="none" stroke="currentColor" stroke-width="1.3">
          <path
            d="M220 220 L0 220 M220 220 L220 0 M220 220 L0 0 M220 220 L70 0 M220 220 L0 100"
          />
          <path
            d="M195 220 Q195 185 220 175 M165 220 Q165 155 220 135 M130 220 Q130 130 220 95 M90 220 Q90 95 220 55 M45 220 Q45 45 220 15"
          />
          <path
            d="M220 195 Q185 195 175 220 M220 165 Q155 165 135 220 M220 130 Q130 130 95 220 M220 90 Q95 90 55 220 M220 45 Q45 45 15 220"
          />
        </g>
      </svg>

      <section class="contenido" id="portada">
        <p class="subtitulo">NO TODAS LAS PUERTAS DEBEN ABRIRSE</p>
        <h1>THE DARK GATE</h1>
        <p class="descripcion">
          Algo espera del otro lado. ¿Te atreves a entrar?
        </p>

        <button
          class="boton-principal"
          id="abrirLogin"
          type="button"
          aria-label="Entrar"
        >
          <span class="puerta">
            <span class="tabla tabla1"></span>
            <span class="tabla tabla2"></span>
            <span class="tabla tabla3"></span>
            <span class="marco-puerta"></span>
            <span class="picaporte"></span>
            <span class="placa-puerta">ENTRAR</span>
          </span>
        </button>
        <p class="instruccion">HAZ CLIC PARA CRUZAR EL UMBRAL</p>
      </section>

      <section class="login" id="login" aria-hidden="true">
        <button
          class="cerrar-login"
          id="cerrarLogin"
          type="button"
          aria-label="Cerrar login"
        >
          ×
        </button>
        <p class="subtitulo">HAS CRUZADO EL UMBRAL</p>
        <h2>ACCESO OSCURO</h2>
        <p class="login-texto">
          Identifícate... si todavía recuerdas quién eres.
        </p>
        <form id="formulario">
          <label for="usuario">USUARIO</label>
          <input
            id="usuario"
            name="usuario"
            type="text"
            placeholder="Tu nombre..."
            autocomplete="username"
            required
          />
          <label for="contrasena">CONTRASEÑA</label>
          <input
            id="contrasena"
            name="contrasena"
            type="password"
            placeholder="Tu contraseña..."
            autocomplete="current-password"
            required
          />
          <button class="boton-enviar" type="submit">INGRESAR</button>
          <p class="mensaje" id="mensaje" role="status"></p>
        </form>
      </section>

      <div class="suelo" aria-hidden="true"></div>
      <div id="particulas" aria-hidden="true"></div>
      <div class="viñeta" aria-hidden="true"></div>
    </main>

    <script>
      const escena = document.getElementById("escena");
      const portada = document.getElementById("portada");
      const abrirLogin = document.getElementById("abrirLogin");
      const login = document.getElementById("login");
      const cerrarLogin = document.getElementById("cerrarLogin");
      const formulario = document.getElementById("formulario");
      const mensaje = document.getElementById("mensaje");
      const particulas = document.getElementById("particulas");

      let transicionEnCurso = false;
      let intervaloParticulas;

      function crearParticula() {
        if (!particulas) return;

        const particula = document.createElement("span");
        particula.className = "particula";
        particula.style.left = `${Math.random() * 100}%`;
        particula.style.setProperty(
          "--deriva",
          `${Math.random() * 140 - 70}px`,
        );
        particula.style.animationDuration = `${5 + Math.random() * 7}s`;
        particula.style.opacity = `${0.2 + Math.random() * 0.55}`;
        particulas.appendChild(particula);

        setTimeout(() => particula.remove(), 12500);
      }

      for (let i = 0; i < 22; i++) {
        setTimeout(crearParticula, i * 180);
      }
      intervaloParticulas = setInterval(crearParticula, 500);

      abrirLogin.addEventListener("click", () => {
        if (transicionEnCurso || login.classList.contains("visible")) return;
        transicionEnCurso = true;

        escena.classList.add("deshaciendo");
        abrirLogin.disabled = true;

        setTimeout(() => {
          portada.hidden = true;
          login.classList.add("visible");
          login.setAttribute("aria-hidden", "false");
          escena.classList.remove("deshaciendo");
          transicionEnCurso = false;
          document.getElementById("usuario").focus({ preventScroll: true });
        }, 720);
      });

      cerrarLogin.addEventListener("click", () => {
        if (transicionEnCurso) return;
        transicionEnCurso = true;

        login.classList.remove("visible");
        login.setAttribute("aria-hidden", "true");

        setTimeout(() => {
          portada.hidden = false;
          abrirLogin.disabled = false;
          escena.classList.add("deshaciendo");

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              escena.classList.remove("deshaciendo");
              transicionEnCurso = false;
            });
          });
          mensaje.textContent = "";
          formulario.reset();
        }, 450);
      });

      formulario.addEventListener("submit", (event) => {
        event.preventDefault();
        mensaje.textContent = "La puerta aún no reconoce tus credenciales...";
      });

      // Mantiene la tormenta y las partículas activas durante toda la escena.
      escena.classList.add("tormenta-activa");
    </script>
  </body>
</html>
