<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dark Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Creepster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="escena tormenta-activa" id="escena">
    <div class="luna" aria-hidden="true"></div>
    <div class="niebla niebla1" aria-hidden="true"></div>
    <div class="niebla niebla2" aria-hidden="true"></div>

    <div class="tormenta" aria-hidden="true"></div>
    <div class="relampago relampago1" aria-hidden="true"></div>
    <div class="relampago relampago2" aria-hidden="true"></div>
    <div class="relampago relampago3" aria-hidden="true"></div>
    <div class="destello" aria-hidden="true"></div>

    <svg class="telarana telarana-superior" viewBox="0 0 220 220" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M0 0 L220 0 M0 0 L0 220 M0 0 L220 220 M0 0 L150 220 M0 0 L220 120"/>
        <path d="M25 0 Q25 35 0 45 M55 0 Q55 65 0 85 M90 0 Q90 90 0 125 M130 0 Q130 125 0 165 M175 0 Q175 175 0 205"/>
        <path d="M0 25 Q35 25 45 0 M0 55 Q65 55 85 0 M0 90 Q90 90 125 0 M0 130 Q125 130 165 0 M0 175 Q175 175 205 0"/>
      </g>
    </svg>
    <svg class="telarana telarana-inferior" viewBox="0 0 220 220" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M220 220 L0 220 M220 220 L220 0 M220 220 L0 0 M220 220 L70 0 M220 220 L0 100"/>
        <path d="M195 220 Q195 185 220 175 M165 220 Q165 155 220 135 M130 220 Q130 130 220 95 M90 220 Q90 95 220 55 M45 220 Q45 45 220 15"/>
        <path d="M220 195 Q185 195 175 220 M220 165 Q155 165 135 220 M220 130 Q130 130 95 220 M220 90 Q95 90 55 220 M220 45 Q45 45 15 220"/>
      </g>
    </svg>

    <section class="contenido" id="portada">
      <p class="subtitulo">NO TODAS LAS PUERTAS DEBEN ABRIRSE</p>
      <h1>THE DARK GATE</h1>
      <p class="descripcion">Algo espera del otro lado. ¿Te atreves a entrar?</p>

      <button class="boton-principal" id="abrirLogin" type="button" aria-label="Entrar">
        <span class="puerta">
          <span class="tabla tabla1"></span>
          <span class="tabla tabla2"></span>
          <span class="tabla tabla3"></span>
          <span class="marco-puerta"></span>
          <span class="picaporte"></span>
          <span class="placa-puerta">ENTRAR</span>
        </span>
      </button>
      <p class="instruccion">HAZ CLIC PARA CRUZAR EL UMBRAL</p>
    </section>

    <section class="login" id="login" aria-hidden="true">
      <button class="cerrar-login" id="cerrarLogin" type="button" aria-label="Cerrar login">×</button>
      <p class="subtitulo">HAS CRUZADO EL UMBRAL</p>
      <h2>ACCESO OSCURO</h2>
      <p class="login-texto">Identifícate... si todavía recuerdas quién eres.</p>
      <form id="formulario">
        <label for="usuario">USUARIO</label>
        <input id="usuario" name="usuario" type="text" placeholder="Tu nombre..." autocomplete="username" required>
        <label for="contrasena">CONTRASEÑA</label>
        <input id="contrasena" name="contrasena" type="password" placeholder="Tu contraseña..." autocomplete="current-password" required>
        <button class="boton-enviar" type="submit">INGRESAR</button>
        <p class="mensaje" id="mensaje" role="status"></p>
      </form>
    </section>

    <div class="suelo" aria-hidden="true"></div>
    <div id="particulas" aria-hidden="true"></div>
    <div class="viñeta" aria-hidden="true"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
